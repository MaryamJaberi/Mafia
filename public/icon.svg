<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="6" />

  <!-- Fedora Hat (Mafia Symbol) -->
  <g filter="url(#shadow)" transform="translate(256, 175) scale(0.95)">
    <!-- Hat Brim -->
    <ellipse cx="0" cy="55" rx="150" ry="24" fill="#18181b" stroke="#3f3f46" stroke-width="4"/>
    <!-- Hat Crown -->
    <path d="M-90,50 C-85,-20 -70,-60 0,-50 C70,-60 85,-20 90,50 Z" fill="#27272a" stroke="#3f3f46" stroke-width="4"/>
    <!-- Crown Crease Top -->
    <path d="M-40,-45 Q0,-25 40,-45" fill="none" stroke="#18181b" stroke-width="8" stroke-linecap="round"/>
    <!-- Hat Ribbon (Gold) -->
    <path d="M-88,38 C-50,48 50,48 88,38 L90,50 C50,60 -50,60 -90,50 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Crossed Accusation Crosshairs / Targets -->
  <g transform="translate(256, 335)" filter="url(#shadow)">
    <!-- Outer Shield / Target Ring -->
    <circle cx="0" cy="0" r="85" fill="#121215" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="12 6" />
    <circle cx="0" cy="0" r="55" fill="none" stroke="#f43f5e" stroke-width="4" opacity="0.6" />
    <circle cx="0" cy="0" r="26" fill="url(#redGrad)" />
    
    <!-- Crosshairs -->
    <line x1="-100" y1="0" x2="-35" y2="0" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="35" y1="0" x2="100" y2="0" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="-100" x2="0" y2="-35" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="35" x2="0" y2="100" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Center Pulse Dot -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- Glowing Accent Stars -->
  <polygon points="100,100 106,114 120,120 106,126 100,140 94,126 80,120 94,114" fill="#fbbf24" opacity="0.8" />
  <polygon points="412,110 416,120 426,124 416,128 412,138 408,128 398,124 408,120" fill="#f43f5e" opacity="0.8" />
</svg>
